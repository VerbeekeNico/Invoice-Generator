# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    
permissions:
  contents: read
  packages: write
  
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  docker:
    needs: build    
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/verbeekenico/incognico-invoicing:latest
          
  build-and-deploy:
      runs-on: ubuntu-latest
      permissions: 
        id-token: write #This is required for requesting the OIDC JWT Token
        contents: read #Required when GH token is used to authenticate with private repo
    
      steps:
        - name: Checkout to the branch
          uses: actions/checkout@v2
    
        - name: Azure Login
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.INVOICINGPORTFOLIOPROJECT_AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.INVOICINGPORTFOLIOPROJECT_AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.INVOICINGPORTFOLIOPROJECT_AZURE_SUBSCRIPTION_ID }}
    
        - name: Deploy to Azure Container App
          uses: azure/container-apps-deploy-action@v2
          with:
            containerAppName: invoicingportfolioproject
            resourceGroup: InvoicingPortfolioProject
            imageToDeploy: ghcr.io/verbeekenico/incognico-invoicing:latest
