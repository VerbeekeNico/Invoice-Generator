# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  workflow_dispatch:
    inputs:
      execute_migrations:
        description: "Execute database migrations"
        required: true
        default: false
        type: boolean
    
permissions:
  contents: read
  packages: write
  id-token: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  docker:
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/verbeekenico/incognico-invoicing:latest
          
  execute-ef-migrations:
    needs: docker
    if: inputs.execute_migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run database migrations
        env:
          ConnectionStrings__Invoicing: ${{ secrets.INVOICING_CONNECTION_STRING }}
        run: |
          dotnet ef database update \
            --project backend/Invoicing.Infrastructure \
            --startup-project backend/IncogNicoInvoicing
        
  build-and-deploy:
      needs: [docker, execute-ef-migrations]
      if: |
        always() &&
        needs.docker.result == 'success' &&
        (needs.execute-ef-migrations.result == 'success' || needs.execute-ef-migrations.result == 'skipped')
      runs-on: ubuntu-latest
      permissions: 
        id-token: write #This is required for requesting the OIDC JWT Token
        contents: read #Required when GH token is used to authenticate with private repo
    
      steps:
        - name: Checkout to the branch
          uses: actions/checkout@v2
    
        - name: Azure Login
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.INVOICINGPORTFOLIOPROJECT_AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.INVOICINGPORTFOLIOPROJECT_AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.INVOICINGPORTFOLIOPROJECT_AZURE_SUBSCRIPTION_ID }}
    
        - name: Deploy to Azure Container App
          uses: azure/container-apps-deploy-action@v2
          with:
            containerAppName: invoicingportfolioproject
            resourceGroup: InvoicingPortfolioProject
            imageToDeploy: ghcr.io/verbeekenico/incognico-invoicing:latest
