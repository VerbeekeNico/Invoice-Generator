
name: Deploy Angular Frontend

on:
  push:
    branches:
      - main
    paths:
      - "Frontend/inv-gen-angular-client/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/verbeekenico/inv-gen-angular-client
  API_URL: https://invoicingportfolioproject.kindsand-e5fda325.westus2.azurecontainerapps.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Angular image
        uses: docker/build-push-action@v6
        with:
          context: Frontend/inv-gen-angular-client
          push: true
          tags: |
            ghcr.io/verbeekenico/inv-gen-angular-client:${{ github.sha }}
            ghcr.io/verbeekenico/inv-gen-angular-client:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy frontend to Azure Container Apps
        env:
          IMAGE: ghcr.io/verbeeknico/inv-gen-angular-client:${{ github.sha }}
        run: |
          az containerapp update \
            --name frontend-azure \
            --resource-group InvoicingPortfolioProject \
            --image "$IMAGE" \
            --set-env-vars API_URL="$API_URL"
